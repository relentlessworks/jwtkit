name: Tag Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o jwtkit-linux-amd64 ./cmd/jwtkit
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o jwtkit-darwin-amd64 ./cmd/jwtkit
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o jwtkit-darwin-arm64 ./cmd/jwtkit

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jwtkit-linux-amd64
            jwtkit-darwin-amd64
            jwtkit-darwin-arm64
          generate_release_notes: true
